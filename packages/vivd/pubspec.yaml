name: vivd
description: Open source Flutter face liveness SDK. 100% on-device, offline, no API key needed.
version: 0.0.1
publish_to: pub.dev

environment:
  sdk: "^3.6.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.12.0
  crypto: ^3.0.3
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.ajianaz.vivd
        pluginClass: VivdPlugin
      ios:
        pluginClass: VivdPlugin
